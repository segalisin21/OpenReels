# Railway — OpenReels API + Web UI (service 1 of 2)
# Also create a Worker service from the same repo with:
#   Start command: npx tsx src/worker.ts
# Add Redis plugin and set REDIS_URL on both services.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx tsx src/server.ts"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
