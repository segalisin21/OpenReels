# Railway — OpenReels API + Web UI + worker (one service, shared /app/jobs volume).
# Requires Redis: REDIS_URL on this service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/scripts/railway-start.sh"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
